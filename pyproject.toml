[project]
name = "smart-digest"
version = "0.1.0"
description = "A fully local, multi-user news digest system with SLM-powered classification"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.0",
    "telethon>=1.37.0",
    "python-telegram-bot>=21.0",
    "ollama>=0.4.0",
    "sentence-transformers>=3.0.0",
    "datasketch>=1.6.0",
    "jinja2>=3.1.4",
    "structlog>=24.0.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "python-slugify>=8.0.4",
    "httpx>=0.27.0",
    "python-igraph>=0.11.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
